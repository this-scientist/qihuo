services:
  mysql:
    image: mysql:8.4
    container_name: qihuo-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_pwd
      MYSQL_DATABASE: futures_quant
      MYSQL_USER: futures
      MYSQL_PASSWORD: futures_pwd
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - qihuo_mysql_data:/var/lib/mysql

volumes:
  qihuo_mysql_data:
